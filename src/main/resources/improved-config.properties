# Improved ASCII Art Generator Configuration
# This configuration file addresses the issues in the original config.properties:
# - Uses relative paths instead of hard-coded absolute paths
# - Includes all configurable parameters with sensible defaults
# - Cross-platform compatible paths
# - Comprehensive documentation

# Input file path (relative to working directory or absolute path)
filePath=sample-coordinates.csv

# Output file path (relative to working directory or absolute path)
outputFile=improved-ascii-art.txt

# Scaling factor for coordinate transformation (higher = larger output)
scaleFactor=50

# Precision factor for coordinate rounding (higher = more detail)
precisionFactor=100

# Character set for ASCII art rendering (from light to dark)
# Default: space, dot, colon, dash, equals, plus, asterisk, hash, percent, at
characterSet= .:-=+*#%@

# Output dimensions (optional - if not specified, uses natural bounds)
# outputWidth=120
# outputHeight=60

# Logging level (TRACE, DEBUG, INFO, WARN, ERROR)
logLevel=INFO
